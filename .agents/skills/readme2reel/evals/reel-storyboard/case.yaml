schema_version: "1.0"
name: reel-storyboard
description: Reel mode audits first, then writes reel/storyboard.md from verified docs, without scaffolding or rendering.
tags: [reel, node]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write]
graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
  - type: file_exists
    name: storyboard-written
    path: reel/storyboard.md
  - type: file_exists
    name: no-project-scaffolded
    path: reel/package.json
    exists: false
  - type: regex
    name: real-install-command
    target: { source: file, path: reel/storyboard.md }
    pattern: "npm install slugmint"
  - type: regex
    name: readme-untouched
    target: { source: file, path: README.md }
    pattern: "Turn any string into a URL slug\\."
