schema_version: "1.0"
name: env-var-missing
description: app/config.py requires WEATHER_API_KEY and reads CACHE_TTL_SECONDS; the README table lists only PORT.
tags: [sync, python, web-app]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 25
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write]
graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
  - type: regex
    name: documents-required-key
    target: { source: file, path: README.md }
    pattern: "\\|\\s*`WEATHER_API_KEY`\\s*\\|"
  - type: regex
    name: documents-cache-ttl
    target: { source: file, path: README.md }
    pattern: "CACHE_TTL_SECONDS"
  - type: regex
    name: no-invented-key-value
    target: { source: file, path: README.md }
    pattern: "WEATHER_API_KEY=\\w{8,}"
    match: not_contains
